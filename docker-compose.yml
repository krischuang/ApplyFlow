version: "3.9"

services:
  # ── Backend (FastAPI) ─────────────────────────────────────────────────────
  backend:
    build: ./backend
    container_name: applyflow-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://applyflow:applyflow@db:5432/applyflow
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      RESUME_STORAGE_PATH: /app/resumes
    volumes:
      - resume_data:/app/resumes
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ── Frontend (Next.js) ────────────────────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: applyflow-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: applyflow-db
    environment:
      POSTGRES_DB: applyflow
      POSTGRES_USER: applyflow
      POSTGRES_PASSWORD: applyflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U applyflow"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  resume_data:
