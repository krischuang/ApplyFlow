spring:
  application:
    name: applyflow

  # ── Local dev: H2 in-memory ──────────────────────────────────────────────
  datasource:
    url: jdbc:h2:mem:applyflowdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop    # recreates schema on every start (dev only)
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  jackson:
    serialization:
      write-dates-as-timestamps: false

# ── Server ───────────────────────────────────────────────────────────────────
server:
  port: 8080

# ── Swagger / OpenAPI ────────────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# ── JWT (placeholder — activate in v2) ───────────────────────────────────────
jwt:
  secret: ${JWT_SECRET:applyflow-dev-secret-key-minimum-32-characters}
  expiration-ms: 86400000

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  level:
    com.krischuang.applyflow: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
